# Receiver example for Ubuntu. Captures raw syslog without interpreting usage.
# For CachyOS ownership and both OS installation steps, see docs/rsyslog-setup.md.
# Defaults allow a local TCP capture test only. For deployment, replace BOTH
# 127.0.0.1 values with the Ubuntu listen address and trusted ISE sender address,
# respectively. Match transport/port with the actual ISE logging target.
# Load imtcp only once if your existing rsyslog configuration already loads it.
global(maxMessageSize="128k")
module(load="imtcp")

template(name="BandwidthRawEnvelope" type="list" option.jsonf="on") {
    property(outname="received_at" name="timegenerated" dateFormat="rfc3339" format="jsonf")
    property(outname="reported_at" name="timereported" dateFormat="rfc3339" format="jsonf")
    property(outname="source_ip" name="fromhost-ip" format="jsonf")
    property(outname="hostname" name="hostname" format="jsonf")
    property(outname="raw_message" name="rawmsg" format="jsonf")
}

ruleset(name="bandwidth_raw_capture") {
    if $fromhost-ip != "127.0.0.1" then stop
    action(
        type="omfile"
        file="/var/log/bandwidth-engine/ise-raw.jsonl"
        template="BandwidthRawEnvelope"
        fileOwner="syslog"
        fileGroup="syslog"
        fileCreateMode="0640"
        dirCreateMode="0750"
    )
    stop
}

input(type="imtcp" address="127.0.0.1" port="5514" ruleset="bandwidth_raw_capture")
