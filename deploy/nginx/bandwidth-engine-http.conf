# Initial HTTP site for the certificate challenge; replace after obtaining TLS.
server {
    listen 80;
    listen [::]:80;
    server_name bandwidth.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
