# Replace bandwidth.example.com and both certificate paths before enabling.
server {
    listen 80;
    listen [::]:80;
    server_name bandwidth.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bandwidth.example.com;

    ssl_certificate /etc/letsencrypt/live/bandwidth.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bandwidth.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";

        # Dashboard events use a long-lived SSE response with 15-second heartbeats.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
